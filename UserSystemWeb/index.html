<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户系统</title>
    <style>
      body {
        margin: 0;
      }
    </style>
    <!-- 首屏前套用持久化的外观配置，避免暗色模式闪白（键名与 app store 的 persist.key 一致） -->
    <script>
      try {
        var appearance = JSON.parse(localStorage.getItem('app:config') || '{}')
        var isDark = appearance.theme === 'dark' ||
          (appearance.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (isDark) {
          document.documentElement.classList.add('dark')
        } else {
          if (appearance.bgColor) document.documentElement.style.setProperty('--el-bg-color-page', appearance.bgColor)
          if (appearance.surfaceColor) document.documentElement.style.setProperty('--el-bg-color', appearance.surfaceColor)
          if (appearance.overlayColor) document.documentElement.style.setProperty('--el-bg-color-overlay', appearance.overlayColor)
        }
        if (appearance.primaryColor) {
          document.documentElement.style.setProperty('--el-color-primary', appearance.primaryColor)
        }
      } catch (e) { /* 配置损坏时忽略，交给 app store 兜底 */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- 运行时配置，需在应用入口之前加载 -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
